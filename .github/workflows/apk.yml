name: APK

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Fetch libFLAC
        run: bash decent/decent-media3-decoder-flac/setup.sh

      - name: Create missing files
        run: touch compose-stability.conf

      - name: Debug keystore
        run: mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore

      - name: Build debug APK
        run: |
          bash ./gradlew --no-daemon :app:assembleDebug 2>&1 | tee /tmp/b.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            msg=$(awk '/\* What went wrong:/,/^\* Try:/' /tmp/b.log)
            [ -z "$msg" ] && msg=$(tail -60 /tmp/b.log)
            echo "::error::$(printf '%s' "$msg" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' | cut -c1-20000)"
            exit "$rc"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: aurora-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
